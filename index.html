<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Image">
<title>AI Image Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237c5cff'/%3E%3Ctext x='50' y='66' font-size='38' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='white'%3EAI%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237c5cff'/%3E%3Ctext x='50' y='66' font-size='38' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='white'%3EAI%3C/text%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json;charset=utf-8,{"name":"AI Image Studio","short_name":"AI Image","start_url":".","display":"standalone","background_color":"%230d0f14","theme_color":"%230d0f14","orientation":"portrait"}'>
<style>
:root{
  --bg:#0d0f14; --card:#161a22; --card2:#1e2431; --border:#262d3b;
  --text:#e6ebf3; --muted:#8a94a8; --accent:#7c5cff; --accent2:#a78bfa;
  --danger:#ff5566; --success:#22c55e;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.5;
  min-height:100vh; min-height:100dvh;
  padding-top:var(--safe-top); padding-bottom:calc(30px + var(--safe-bottom));
  font-size:16px;
}
input,textarea,select,button{font-family:inherit;font-size:16px}

/* Header */
header{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px; border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,#14181f,#0d0f14);
  position:sticky;top:var(--safe-top);z-index:10;
}
header h1{font-size:18px;font-weight:700}
.icon-btn{
  width:44px;height:44px;border-radius:12px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.icon-btn:active{background:var(--card2)}

/* Tabs */
.tabs{display:flex;gap:8px;padding:12px 16px}
.tab{
  flex:1;padding:12px 8px;background:var(--card);border:1px solid var(--border);
  border-radius:12px;color:var(--muted);font-size:14px;font-weight:600;
  cursor:pointer;transition:.15s;min-height:48px;
}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Panels */
main{padding:0 16px}
.panel{display:none;flex-direction:column;gap:14px}
.panel.active{display:flex}

textarea,input[type=text],input[type=password]{
  width:100%;padding:14px;background:var(--card);border:1px solid var(--border);
  border-radius:12px;color:var(--text);resize:vertical;font-size:16px;
  transition:.15s;
}
textarea:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.15)}
textarea{min-height:90px}

/* Chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  padding:10px 14px;background:var(--card);border:1px solid var(--border);
  border-radius:10px;color:var(--muted);font-size:14px;font-weight:500;
  cursor:pointer;min-height:42px;transition:.15s;
}
.chip.active{background:var(--card2);color:var(--text);border-color:var(--accent)}

/* Primary button */
.primary{
  padding:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;border-radius:14px;color:#fff;font-weight:700;font-size:17px;
  cursor:pointer;transition:.15s;min-height:54px;
  box-shadow:0 6px 20px -8px var(--accent);
}
.primary:active:not(:disabled){transform:scale(.98)}
.primary:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}

/* Drop zone */
.drop{
  border:2px dashed var(--border);border-radius:16px;padding:24px;
  text-align:center;cursor:pointer;min-height:180px;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;
  color:var(--muted);transition:.15s;
}
.drop:active,.drop.hover{border-color:var(--accent);background:rgba(124,92,255,.05)}
.drop img{max-width:100%;max-height:300px;border-radius:10px;display:block}

/* Status */
#status{margin:16px 0 10px;font-size:14px;color:var(--muted);min-height:20px}
#status.error{color:var(--danger)}
#status.success{color:var(--success)}

/* Results */
#results{display:flex;flex-direction:column;gap:16px}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  overflow:hidden;animation:fadeIn .3s ease;
}
.card img{width:100%;display:block}
.card-actions{display:flex;gap:1px;background:var(--border)}
.card-btn{
  flex:1;padding:14px 8px;background:var(--card2);border:none;color:var(--text);
  font-size:15px;font-weight:600;cursor:pointer;min-height:50px;
}
.card-btn:active{background:var(--accent);color:#fff}

/* Hint */
.hint{font-size:13px;color:var(--muted);padding:0 2px;line-height:1.5}
.hint a{color:var(--accent2);text-decoration:none}
.hint a:active{text-decoration:underline}

/* Modal (bottom sheet) */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;
  display:flex;align-items:flex-end;animation:fadeIn .2s;
}
.modal[hidden]{display:none}
.modal-content{
  width:100%;background:var(--card);border-radius:20px 20px 0 0;
  padding:24px 20px calc(24px + var(--safe-bottom));
  max-height:85vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:14px;
  animation:slideUp .25s ease-out;
}
.modal-content h2{font-size:18px;margin-bottom:4px}
.modal-content label{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--muted)}
.modal-row{display:flex;gap:10px;margin-top:8px}
.modal-row button{flex:1}
.btn-secondary{
  padding:16px;background:var(--card2);border:1px solid var(--border);
  border-radius:14px;color:var(--text);font-weight:600;font-size:16px;
  cursor:pointer;min-height:54px;
}

/* Loading spinner */
.spinner{
  display:inline-block;width:16px;height:16px;border:2px solid var(--muted);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px;
}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <h1>🎨 AI Image Studio</h1>
  <button class="icon-btn" id="btnSettings" aria-label="ตั้งค่า">⚙️</button>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="create">✨ สร้างภาพ</button>
  <button class="tab" data-tab="edit">🪄 แก้ไขภาพ</button>
</nav>

<main>
  <!-- ============ สร้างภาพ ============ -->
  <section id="tab-create" class="panel active">
    <textarea id="prompt" placeholder="พิมพ์คำสั่ง เช่น &#10;• แมวสีส้มนั่งบนดวงจันทร์ แสงนุ่ม สไตล์สีน้ำ&#10;• พระอาทิตย์ตกที่ทะเล ภาพถ่ายมุมสูง"></textarea>

    <div class="chips" id="sizeChips">
      <button class="chip active" data-size="1024x1024">⬛ 1:1</button>
      <button class="chip" data-size="1024x1536">📱 9:16</button>
      <button class="chip" data-size="1536x1024">🖥️ 16:9</button>
    </div>

    <div class="chips" id="styleChips">
      <button class="chip active" data-style="">ปกติ</button>
      <button class="chip" data-style=", photorealistic, high detail, 8k, professional photo">📷 เหมือนจริง</button>
      <button class="chip" data-style=", anime style, vibrant colors, studio ghibli">🎌 อนิเมะ</button>
      <button class="chip" data-style=", oil painting, artistic, masterpiece">🖼️ ภาพวาด</button>
      <button class="chip" data-style=", 3d render, pixar style, cute">🎬 3D</button>
    </div>

    <button class="primary" id="btnGenerate">✨ สร้างภาพ</button>
  </section>

  <!-- ============ แก้ไขภาพ ============ -->
  <section id="tab-edit" class="panel">
    <div class="drop" id="drop">
      <input type="file" id="imageFile" accept="image/*" hidden>
      <div id="dropContent">
        <div style="font-size:52px">📷</div>
        <div style="font-size:15px">แตะเพื่อเลือกรูป</div>
      </div>
      <img id="preview" hidden alt="preview">
    </div>

    <textarea id="editPrompt" placeholder="คำสั่งแก้ไข เช่น &#10;• เปลี่ยนพื้นหลังเป็นชายหาดยามพระอาทิตย์ตก&#10;• ทำให้เป็นสไตล์อนิเมะ"></textarea>

    <button class="primary" id="btnEdit">🪄 แก้ไขภาพ</button>
    <p class="hint" id="editHint"></p>
  </section>

  <div id="status"></div>
  <div id="results"></div>
</main>

<!-- ============ Settings ============ -->
<div class="modal" id="modal" hidden>
  <div class="modal-content">
    <h2>⚙️ ตั้งค่า</h2>

    <label>HuggingFace Token (สำหรับแก้ไขภาพ)
      <input type="password" id="hfToken" placeholder="hf_..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </label>
    <p class="hint">
      🔑 รับฟรีได้ที่
      <a href="https://huggingface.co/settings/tokens" target="_blank" rel="noopener">huggingface.co/settings/tokens</a>
      → "New token" → เลือก Read → สร้างแล้วคัดลอกมาใส่
    </p>

    <label>โมเดลแก้ไขภาพ
      <input type="text" id="editModel" placeholder="timbrooks/instruct-pix2pix" autocorrect="off" autocapitalize="off" spellcheck="false">
    </label>
    <p class="hint">ถ้าใช้ไม่ได้ ลองเปลี่ยนเป็น <code>stabilityai/stable-diffusion-xl-base-1.0</code></p>

    <div class="modal-row">
      <button class="btn-secondary" id="btnCloseModal">ปิด</button>
      <button class="primary" id="btnSaveSettings">บันทึก</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const $$ = s => document.querySelectorAll(s);

  // ===== State =====
  const state = { size: '1024x1024', style: '', editingImage: null, busy: false };
  const settings = {
    hfToken: localStorage.getItem('hfToken') || '',
    editModel: localStorage.getItem('editModel') || 'timbrooks/instruct-pix2pix'
  };

  // ===== Status =====
  function setStatus(msg, type = '') {
    const el = $('#status');
    el.innerHTML = msg;
    el.className = type;
  }
  function loadingStatus(label, sec) {
    setStatus(`<span class="spinner"></span>${label} ${sec}s`);
  }

  // ===== Tabs =====
  $$('.tab').forEach(tab => {
    tab.onclick = () => {
      $$('.tab').forEach(t => t.classList.remove('active'));
      $$('.panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      $('#tab-' + tab.dataset.tab).classList.add('active');
      updateEditHint();
    };
  });

  function updateEditHint() {
    const el = $('#editHint');
    if (!settings.hfToken) {
      el.innerHTML = '⚠️ ต้องใส่ HuggingFace token ก่อน (ฟรี) → แตะ ⚙️ มุมขวาบน';
    } else {
      el.innerHTML = `✅ พร้อมใช้งาน • โมเดล: <code>${settings.editModel}</code>`;
    }
  }

  // ===== Chips =====
  function bindChips(containerSel, key) {
    $$(containerSel + ' .chip').forEach(chip => {
      chip.onclick = () => {
        $$(containerSel + ' .chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        state[key] = chip.dataset[key === 'size' ? 'size' : 'style'] ?? chip.dataset.style ?? '';
        if (key === 'size') state.size = chip.dataset.size;
        else state.style = chip.dataset.style;
      };
    });
  }
  $$('#sizeChips .chip').forEach(c => c.onclick = () => {
    $$('#sizeChips .chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    state.size = c.dataset.size;
  });
  $$('#styleChips .chip').forEach(c => c.onclick = () => {
    $$('#styleChips .chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    state.style = c.dataset.style;
  });

  // ===== Add result card =====
  function addResult(src, opts = {}) {
    const card = document.createElement('div');
    card.className = 'card';

    const img = document.createElement('img');
    img.src = src;
    img.alt = 'AI result';
    img.loading = 'lazy';

    const actions = document.createElement('div');
    actions.className = 'card-actions';

    const saveBtn = document.createElement('button');
    saveBtn.className = 'card-btn';
    saveBtn.textContent = '💾 บันทึก';
    saveBtn.onclick = () => saveImage(src);

    actions.append(saveBtn);

    if (opts.retry) {
      const retryBtn = document.createElement('button');
      retryBtn.className = 'card-btn';
      retryBtn.textContent = '🔄 สร้างใหม่';
      retryBtn.onclick = opts.retry;
      actions.append(retryBtn);
    }

    card.append(img, actions);
    $('#results').prepend(card);
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // ===== Save image (mobile-friendly) =====
  async function saveImage(src) {
    try {
      const res = await fetch(src);
      const blob = await res.blob();
      const ext = (blob.type.split('/')[1] || 'png').split('+')[0];
      const file = new File([blob], `ai-image-${Date.now()}.${ext}`, { type: blob.type });

      // Try Web Share first (best for mobile)
      if (navigator.canShare?.({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: 'AI Image' });
          setStatus('✅ แชร์/บันทึกเรียบร้อย', 'success');
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      // Fallback: download link
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = file.name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      setStatus('💾 ดาวน์โหลดแล้ว (ดูใน Downloads/Photos)', 'success');
    } catch (e) {
      // Last resort: open in new tab (long-press to save)
      window.open(src, '_blank');
      setStatus('💡 แตะค้างที่รูปเพื่อบันทึก', '');
    }
  }

  // ===== Generate (Pollinations — free, no key) =====
  $('#btnGenerate').onclick = async () => {
    if (state.busy) return;
    const prompt = $('#prompt').value.trim();
    if (!prompt) return setStatus('กรุณาพิมพ์คำสั่งก่อน', 'error');

    const fullPrompt = prompt + state.style;
    const [w, h] = state.size.split('x');
    const seed = Math.floor(Math.random() * 1e9);
    const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?width=${w}&height=${h}&seed=${seed}&nologo=true&model=flux`;

    state.busy = true;
    $('#btnGenerate').disabled = true;

    let sec = 0;
    loadingStatus('กำลังสร้าง...', sec);
    const timer = setInterval(() => {
      sec++;
      loadingStatus('กำลังสร้าง...', sec);
    }, 1000);

    try {
      // Preload to detect completion/errors
      await new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = resolve;
        img.onerror = () => reject(new Error('สร้างภาพไม่สำเร็จ กรุณาลองใหม่'));
        img.src = url;
        // 90s timeout
        setTimeout(() => reject(new Error('หมดเวลา — กรุณาลองใหม่')), 90000);
      });

      clearInterval(timer);
      addResult(url, { retry: () => $('#btnGenerate').click() });
      setStatus('✅ สร้างเสร็จแล้ว!', 'success');
    } catch (e) {
      clearInterval(timer);
      setStatus('❌ ' + e.message, 'error');
    } finally {
      state.busy = false;
      $('#btnGenerate').disabled = false;
    }
  };

  // ===== Image upload =====
  const drop = $('#drop');
  const fileInput = $('#imageFile');
  const preview = $('#preview');
  const dropContent = $('#dropContent');

  drop.onclick = () => fileInput.click();
  fileInput.onchange = e => handleFile(e.target.files[0]);

  ['dragenter', 'dragover'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hover'); })
  );
  ['dragleave', 'drop'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hover'); })
  );
  drop.addEventListener('drop', e => handleFile(e.dataTransfer.files[0]));

  function handleFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    state.editingImage = file;
    preview.src = URL.createObjectURL(file);
    preview.hidden = false;
    dropContent.hidden = true;
  }

  // ===== Compress & convert =====
  function compressImage(file, maxSize = 768) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(b => b ? resolve(b) : reject(new Error('บีบอัดรูปไม่สำเร็จ')), 'image/jpeg', 0.85);
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }

  async function imageToBase64(file) {
    const blob = await compressImage(file, 768);
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  // ===== Edit image (HuggingFace) =====
  $('#btnEdit').onclick = async () => {
    if (state.busy) return;
    if (!settings.hfToken) {
      openSettings();
      return setStatus('⚠️ กรุณาใส่ HuggingFace token ก่อน', 'error');
    }
    if (!state.editingImage) return setStatus('กรุณาเลือกรูปภาพก่อน', 'error');

    const instruction = $('#editPrompt').value.trim();
    if (!instruction) return setStatus('กรุณาพิมพ์คำสั่งแก้ไข', 'error');

    state.busy = true;
    $('#btnEdit').disabled = true;

    let sec = 0;
    loadingStatus('กำลังแก้ไข...', sec);
    const timer = setInterval(() => {
      sec++;
      loadingStatus('กำลังแก้ไข...', sec);
    }, 1000);

    try {
      const base64 = await imageToBase64(state.editingImage);

      const res = await fetch(
        `https://api-inference.huggingface.co/models/${settings.editModel}`,
        {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${settings.hfToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            inputs: base64,
            parameters: {
              prompt: instruction,
              num_inference_steps: 20,
              image_guidance_scale: 1.5,
              guidance_scale: 7.5
            },
            options: { wait_for_model: true }
          })
        }
      );

      clearInterval(timer);
      const ct = res.headers.get('content-type') || '';

      if (!res.ok || ct.includes('application/json')) {
        const text = await res.text();
        let err;
        try { err = JSON.parse(text); } catch { err = { error: text }; }
        throw new Error(err.error || `HTTP ${res.status}`);
      }

      const blob = await res.blob();
      if (blob.size < 1000) throw new Error('ไม่ได้รับรูปกลับมา ลองเปลี่ยนโมเดลในหน้าตั้งค่า');

      addResult(URL.createObjectURL(blob), { retry: () => $('#btnEdit').click() });
      setStatus('✅ แก้ไขเสร็จแล้ว!', 'success');
    } catch (e) {
      clearInterval(timer);
      setStatus('❌ ' + e.message, 'error');
    } finally {
      state.busy = false;
      $('#btnEdit').disabled = false;
    }
  };

  // ===== Settings modal =====
  const modal = $('#modal');
  function openSettings() {
    $('#hfToken').value = settings.hfToken;
    $('#editModel').value = settings.editModel;
    modal.hidden = false;
  }
  function closeSettings() { modal.hidden = true; }

  $('#btnSettings').onclick = openSettings;
  $('#btnCloseModal').onclick = closeSettings;
  modal.onclick = e => { if (e.target === modal) closeSettings(); };

  $('#btnSaveSettings').onclick = () => {
    settings.hfToken = $('#hfToken').value.trim();
    settings.editModel = $('#editModel').value.trim() || 'timbrooks/instruct-pix2pix';
    try {
      localStorage.setItem('hfToken', settings.hfToken);
      localStorage.setItem('editModel', settings.editModel);
    } catch {}
    updateEditHint();
    closeSettings();
